[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-opensearch-audit"
version = "0.1.0"
description = "Audit OpenSearch Service domains for resilience, encryption, access-policy and lifecycle misconfiguration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "opensearch", "elasticsearch", "audit", "sre", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.28"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
aws-opensearch-audit = "aws_opensearch_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-opensearch-audit"
Issues = "https://github.com/moveeeax/aws-opensearch-audit/issues"

[tool.setuptools]
packages = ["aws_opensearch_audit"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
