name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Audit the example payload
        run: |
          set +e
          aws-opensearch-audit --from-json examples/prod.json --format markdown
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 on a payload with critical findings, got $code"
            exit 1
          fi

      - name: A clean payload must exit zero
        run: aws-opensearch-audit --from-json tests/fixtures/clean_vpc.json
